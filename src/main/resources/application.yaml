server:
  port: 8085

spring:
  application:
    name: ms-campuslab-audit

  datasource:
    url: jdbc:mysql://localhost:3306/audit_db?createDatabaseIfNotExist=true
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/<TENANT_ID>/v2.0V1__create_audit_events_table
